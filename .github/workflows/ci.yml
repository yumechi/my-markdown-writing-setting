name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run textlint
        run: pnpm textlint work/
